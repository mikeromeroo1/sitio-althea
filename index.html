        w[l] = w[l] || [];
        w[l].push({ 'gtm.start': new Date().getTime(), event: 'gtm.js' });
        function cargar() {

            j = d.createElement(s),
            dl = l != 'dataLayer' ? '&l=' + l : '';
          j.async = true;
          j.src = 'https://www.googletagmanager.com/gtm.js?id=' + i + dl;
          f.parentNode.insertBefore(j, f);
        }
        if (d.readyState === 'complete') cargar();
        else w.addEventListener('load', cargar);

         que monte React o se vería un destello de la home. Este script es clásico

        if (r) r.textContent = '';
